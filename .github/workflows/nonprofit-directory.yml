name: Deploy Texas Nonprofit Directory

on:
  push:
    branches: [main]
    paths: ["texas-nonprofit-directory/**", ".github/workflows/nonprofit-directory.yml"]
  schedule:
    - cron: "17 6 3 * *" # monthly, after the IRS refreshes the EO BMF
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: texas-nonprofit-directory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data from the IRS Texas extract
        run: node scripts/build-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: texas-nonprofit-directory
      - id: deployment
        uses: actions/deploy-pages@v4
