name: Deploy TX Nonprofits

# Builds the directory from the latest IRS data and publishes the backup copy on
# GitHub Pages (unless the repository variable DEPLOY_GITHUB_PAGES is "false").
# txnonprofit.com is deployed by Cloudflare Workers Builds, which is connected to
# this repository and uses texas-nonprofit-directory/wrangler.jsonc.

on:
  push:
    branches: [main]
    paths: ["texas-nonprofit-directory/**", ".github/workflows/nonprofit-directory.yml"]
  schedule:
    - cron: "17 6 3 * *" # monthly, after the IRS refreshes the EO BMF
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-directory
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data from the IRS Texas extract
        working-directory: texas-nonprofit-directory
        run: node scripts/build-data.mjs

      - if: vars.DEPLOY_GITHUB_PAGES != 'false'
        uses: actions/configure-pages@v5
      - if: vars.DEPLOY_GITHUB_PAGES != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: texas-nonprofit-directory
      - if: vars.DEPLOY_GITHUB_PAGES != 'false'
        uses: actions/deploy-pages@v4
